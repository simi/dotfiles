setw -g xterm-keys on
# set-option -g default-terminal "xterm-256color"
set -g default-terminal screen-256color
set -g mouse on
set -g word-separators " \"'(),;<=>[]{}"
# to enable mouse scroll, see https://github.com/tmux/tmux/issues/145#issuecomment-150736967
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
set-option -g history-limit 99999
bind -n End send-key C-e
bind -n Home send-key C-a

if-shell 'test "$(uname)" = Linux' {
  bind-key -n MouseDown3Pane if-shell -F '#{m/r:^https?://,#{mouse_word}}' \
    'display-menu -T "#{mouse_word}" -x M -y M \
      "Open in Chrome" c "run-shell -b \"google-chrome #{q:mouse_word} >/dev/null 2>&1\"" \
      "Open in Brave" b "run-shell -b \"brave-browser #{q:mouse_word} >/dev/null 2>&1\""' \
    'send-keys -M'
}

bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
